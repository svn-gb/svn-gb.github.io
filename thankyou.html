<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank You</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="light-theme"> <main class="section" style="height: 100vh; display: flex; align-items: center;">
    <div class="container">
      <div class="thank-you-card reveal">
        <h1 class="serif" style="font-size: 3rem;">🎉 Message Sent!</h1>
        <p class="lead" style="color: var(--accent); margin-top: 20px;">
          Thank you for reaching out. I’ve received your message and will respond within 48 hours.
        </p>
        <div class="thank-you-actions" style="margin-top: 40px;">
          <a href="index.html" class="huge-link" style="font-size: 2rem;">Back to Home</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      document.querySelector(".reveal")?.classList.add("visible");
    });
  </script>
</body>
</html>
